name: CI

# The frontend had no CI — the only build gate was Vercel at deploy time, so a
# CI=true failure (e.g. an unused import) was only caught AFTER it broke
# production (see CLAUDE.md's account of commit 245b8c2). This runs the exact
# Vercel-equivalent build on every push/PR so that class of break is caught
# before merge, not in prod.
on:
  push:
    branches: [main]
  pull_request:
  # Manual re-run. PR #61 was opened and GitHub created no run for its head
  # commit at all — the same silence backend PR #86 hit, and the reason
  # workflow_dispatch was added there. With only push/pull_request triggers
  # there is no way to ask for one, so the only remaining lever is pushing a
  # commit purely to provoke CI. A PR showing no checks reads as "nothing to
  # report" when it means "nothing was checked", which is the more dangerous
  # of the two — and this repo's whole reason for having CI is that a
  # CI=true-only failure used to be caught by Vercel in production. A green
  # Vercel preview is not that check: it deploys the build, it does not run
  # the test suite.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install
        run: npm ci
      # CI=true npm run build is the authoritative gate (per CLAUDE.md): its
      # `prebuild` generates src/buildInfo.generated.ts, then react-scripts
      # type-checks AND treats every ESLint warning as an error, exactly like
      # Vercel. A standalone `tsc` step would run before buildInfo.generated
      # exists and fail spuriously, so the build is the single check.
      - name: Build (CI=true — type-check + warnings-as-errors, exactly like Vercel)
        run: CI=true npm run build
      # The whole test suite, no exclusions.
      #
      # This repo had 60 tests CI never ran, so none of them protected anything —
      # App.test.tsx had been failing since the project was scaffolded and nobody
      # knew. trustEngine.test.ts was then excluded because two of its cases
      # encoded Trust Intelligence Bible §9 faithfully while the engine had
      # diverged from it, which was a product decision about how submissions get
      # judged rather than test hygiene.
      #
      # That decision is now made: the engine implements §9 as written. A
      # submission clearing the pass threshold while carrying flags is FLAG /
      # REVIEW rather than silently APPROVED, and the 50-69 band is HIGH risk.
      # Nothing is excluded any more, and nothing should be again — an excluded
      # suite reads as a passing one.
      - name: Tests
        run: CI=true npx react-scripts test --watchAll=false
      # Advisory dependency scan — surfaced in the log, not blocking (xlsx/CRA
      # have known advisories; tighten once triaged).
      - name: Dependency audit
        continue-on-error: true
        run: npm audit --audit-level=high
